services:
  php:
    build:
      context: .
      dockerfile: dockerimages/phptestenv/Dockerfile
    image: dockerimages/phptestenv:php8.3
    container_name: tetthys-wrap-test
    working_dir: /workspace
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_ROOT_VERSION: "dev-main"
    volumes:
      - .:/workspace
    # Always test a specific file directly
    command: >
      sh -lc "
        set -euo pipefail &&
        git config --global --add safe.directory /workspace &&
        composer install --no-interaction --prefer-dist --ansi &&
        if [ ! -f vendor/bin/pest ]; then
          composer require --dev pestphp/pest:^3 pestphp/pest-plugin-expectations:^3 --no-interaction --prefer-dist --ansi;
        fi &&
        ./vendor/bin/pest --colors=always -vv tests/Unit/WrapTest.php
      "
